version: "2"
linters:
  enable:
    - gocritic
    - gosec
    #- revive
    - bodyclose
    - contextcheck
    - errorlint
  settings:
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - example/
      - _test\.go$
formatters:
  exclusions:
    generated: lax
    paths:
      - example/
      - _test\.go$
